# Publica uma versão nova: mude "version" no package.json, faça commit e crie a tag (ex.: git tag v1.1.0 && git push --tags)
# ou abra a aba Actions no GitHub, escolha "Lançar versão" e clique em "Run workflow".
name: Lançar versão
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
